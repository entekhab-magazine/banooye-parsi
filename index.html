<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>کارگاه بانوی پارسی | مجله انتخاب</title>
<style>
@font-face{font-family:IR;src:url(fonts/MTNIrancell-DemiBold.ttf);font-weight:400;font-display:swap}
@font-face{font-family:IR;src:url(fonts/MTNIrancell-Bold.ttf);font-weight:700;font-display:swap}
:root{--navy:#1f2a44;--paper:#f6f1e7;--gold:#b8924e;--gold2:#d4af6a;--line:#e3d8c3;--ink:#1f2a44}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:IR,Tahoma,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
header{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.logo{font-size:26px;font-weight:700}.logo b{color:var(--gold2)}
.acts{display:flex;gap:10px}
.act{display:flex;align-items:center;gap:8px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:8px 16px;font-size:15px;text-decoration:none}
.act:hover{border-color:var(--gold2);color:var(--gold2)}
.act.pri{background:var(--gold2);border-color:var(--gold2);color:var(--navy)}.act.pri:hover{background:#e6c486;color:var(--navy)}
.act svg{width:18px;height:18px}
.title{text-align:center;padding-top:12px;height:62px;font-weight:700;font-size:20px}
.title small{display:block;font-weight:400;font-size:13px;color:#8a7a5c}
#stage{height:calc(100% - 64px - 62px - 72px);display:flex;align-items:center;justify-content:center;gap:28px;padding:10px 16px}
#sizer{width:min(calc(100vw - 200px),calc((100vh - 230px)*1.414))}
.page{background:#fff}
.page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.arr{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:22px;display:grid;place-items:center}
.arr:hover{background:var(--gold);color:#fff}
footer{height:72px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px}
#open{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border:0;border-radius:24px;padding:11px 22px;font-size:15px}
#open svg{width:18px;height:18px;transition:transform .3s}
#open.on svg{transform:rotate(180deg)}
#fs{background:transparent;border:1px solid var(--line);border-radius:24px;padding:10px 18px;color:var(--ink);font-size:15px}
/* drawer */
#drawer{position:fixed;left:0;right:0;bottom:72px;background:#fff;border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(31,42,68,.18);border-radius:20px 20px 0 0;padding:16px 24px 22px;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5}
#drawer.on{transform:none}
#drawer .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px}
#drawer .head b{color:var(--gold)}
#close{background:none;border:0;font-size:22px;color:#888}
#thumbs{display:flex;gap:10px;justify-content:center;margin-bottom:14px;direction:rtl;overflow-x:auto;padding-bottom:4px}
#thumbs img{height:86px;border:2px solid transparent;border-radius:4px;opacity:.55;cursor:pointer;transition:.2s;flex:none}
#thumbs img.on{border-color:var(--gold);opacity:1;transform:translateY(-3px)}
#slider{width:100%;direction:rtl;accent-color:var(--gold);height:28px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(to left,var(--gold) var(--p,0%),#e8e1d2 var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--navy);border:4px solid var(--gold2);box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#e8e1d2}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--navy);border:4px solid var(--gold2)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:#9a8b6e;padding:0 6px}
#toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-20px);background:var(--navy);color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  header{height:56px;padding:0 14px}.logo{font-size:21px}
  .act{padding:8px 10px}.act span{display:none}
  .title{height:66px;padding-top:10px;font-size:17px}
  .title small{margin-top:6px}
  #stage{height:calc(100% - 56px - 66px - 72px);gap:0;padding:8px}
  #sizer{width:min(94vw,calc((100vh - 200px)*.707))}
  .arr{display:none}
  #fs{display:none}
  #drawer{padding:14px 16px 20px}
  #thumbs{justify-content:flex-start}#thumbs img{height:72px}
}
</style>
</head>
<body>
<header>
  <div class="logo">مجله <b>انتخاب</b></div>
  <div class="acts">
    <button class="act" id="share" title="اشتراک‌گذاری"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>اشتراک‌گذاری</span></button>
    <a class="act pri" href="banooye-parsi.pdf" download="کارگاه بانوی پارسی - مجله انتخاب.pdf" title="دانلود PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>دانلود PDF</span></a>
  </div>
</header>
<div class="title">کارگاه بانوی پارسی<small>مجله انتخاب · ویژه‌نامهٔ کارگاه‌ها</small></div>
<div id="stage">
  <button class="arr" id="prev" title="صفحهٔ قبل">→</button>
  <div id="sizer"><div id="book"></div></div>
  <button class="arr" id="next" title="صفحهٔ بعد">←</button>
</div>
<div id="drawer">
  <div class="head"><span>جابه‌جایی بین صفحه‌ها</span><span><b id="dnum"></b></span><button id="close" title="بستن">×</button></div>
  <div id="thumbs"></div>
  <input type="range" id="slider" min="1" max="10" step="1" value="1">
  <div class="ticks" id="ticks"></div>
</div>
<footer>
  <button id="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg><span id="num"></span></button>
  <button id="fs">⛶ تمام‌صفحه</button>
</footer>
<div id="toast"></div>
<script src="page-flip.browser.js"></script>
<script>
const N=10, $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const book=$('book');
// RTL: pages are added in reverse so flipping from left to right moves forward
for(let i=N;i>=1;i--){
  const d=document.createElement('div');d.className='page';
  if(i===1||i===N)d.dataset.density='hard';
  d.innerHTML=`<img src="p${i}.webp" alt="صفحه ${i}" loading="${i<=3?'eager':'lazy'}">`;
  book.appendChild(d);
}
const pf=new St.PageFlip(book,{width:595,height:842,size:'stretch',minWidth:280,maxWidth:900,minHeight:350,maxHeight:1270,
  showCover:true,usePortrait:true,mobileScrollSupport:false,maxShadowOpacity:.5,startPage:N-1});
pf.loadFromHTML(document.querySelectorAll('.page'));
const goto=p=>pf.turnToPage(N-p);   // jump without animation while dragging
const flipTo=p=>pf.flip(N-p);       // animated jump

// thumbnails + ticks
const th=$('thumbs');
for(let i=1;i<=N;i++){const im=new Image();im.src=`p${i}.webp`;im.alt='صفحه '+fa(i);im.loading='lazy';im.onclick=()=>flipTo(i);th.appendChild(im)}
$('ticks').innerHTML=Array.from({length:N},(_,i)=>`<span>${fa(i+1)}</span>`).join('');

const label=p=>{const two=pf.getOrientation()==='landscape'&&p>1&&p<N;
  if(!two)return [p];const a=p%2?p-1:p;return [a,a+1]};
const upd=()=>{
  const p=N-pf.getCurrentPageIndex(),pg=label(p);
  const t=(pg.length>1?fa(pg[0])+'–'+fa(pg[1]):fa(pg[0]))+' از '+fa(N);
  $('num').textContent='صفحهٔ '+t;$('dnum').textContent=t;
  if(!dragging){$('slider').value=p;paint()}
  [...th.children].forEach((im,i)=>im.classList.toggle('on',pg.includes(i+1)));
  const on=th.querySelector('.on');if(on&&$('drawer').classList.contains('on'))on.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
};
const paint=()=>{const s=$('slider');s.style.setProperty('--p',((s.value-1)/(N-1)*100)+'%')};
let dragging=false;
const sl=$('slider');
sl.addEventListener('input',()=>{dragging=true;paint();goto(+sl.value);upd()});
sl.addEventListener('change',()=>{dragging=false;upd()});
pf.on('flip',upd);pf.on('changeOrientation',upd);pf.on('changeState',upd);upd();

$('next').onclick=()=>pf.flipPrev();
$('prev').onclick=()=>pf.flipNext();
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pf.flipPrev();if(e.key==='ArrowRight')pf.flipNext();if(e.key==='Escape')toggle(false)});
const toggle=v=>{$('drawer').classList.toggle('on',v);$('open').classList.toggle('on',v);if(v)upd()};
$('open').onclick=()=>toggle(!$('drawer').classList.contains('on'));
$('close').onclick=()=>toggle(false);
const m=location.hash.match(/^#p(\d+)(o?)$/);if(m){setTimeout(()=>{goto(Math.min(N,+m[1]));if(m[2])toggle(true);upd()},300)}
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
$('share').onclick=async()=>{
  const data={title:'کارگاه بانوی پارسی | مجله انتخاب',text:'مجله انتخاب: کارگاه بانوی پارسی',url:location.href};
  if(navigator.share){try{await navigator.share(data)}catch(e){}return}
  try{await navigator.clipboard.writeText(location.href);toast('نشانی صفحه کپی شد')}
  catch(e){prompt('نشانی صفحه را کپی کنید:',location.href)}
};
</script>
</body>
</html>
