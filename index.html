<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>کارگاه بانوی پارسی</title>
<style>
:root{--bg:#1d2230;--fg:#f3f1ec;--accent:#c9a45c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,sans-serif;overflow:hidden}
#wrap{height:calc(100% - 64px);display:flex;align-items:center;justify-content:center;padding:12px}
#sizer{margin:auto;width:min(96vw,calc((100vh - 96px)*1.414))}
@media (max-width:640px){#sizer{width:min(94vw,calc((100vh - 96px)*0.707))}#bar{gap:6px}button{padding:7px 10px;font-size:13px}#fs{display:none}}
.page{background:#fff}
.page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
#bar{height:64px;display:flex;align-items:center;justify-content:center;gap:16px}
button{background:transparent;color:var(--fg);border:1px solid var(--accent);border-radius:20px;padding:8px 18px;font:inherit;cursor:pointer}
button:hover{background:var(--accent);color:var(--bg)}
#num{min-width:90px;text-align:center}
</style>
</head>
<body>
<div id="wrap"><div id="sizer"><div id="book"></div></div></div>
<div id="bar">
  <button id="next">صفحهٔ بعد ←</button>
  <span id="num"></span>
  <button id="prev">→ صفحهٔ قبل</button>
  <button id="fs">تمام‌صفحه</button>
</div>
<script src="page-flip.browser.js"></script>
<script>
const N=10;
const book=document.getElementById('book');
// RTL: pages are added in reverse so flipping from left to right moves forward
for(let i=N;i>=1;i--){
  const d=document.createElement('div');d.className='page';
  if(i===1||i===N)d.dataset.density='hard';
  d.innerHTML=`<img src="p${i}.webp" alt="صفحه ${i}" loading="${i<=3?'eager':'lazy'}">`;
  book.appendChild(d);
}
const pf=new St.PageFlip(book,{width:595,height:842,size:'stretch',minWidth:300,maxWidth:900,minHeight:350,maxHeight:1270,
  showCover:true,usePortrait:true,mobileScrollSupport:false,maxShadowOpacity:.5,startPage:N-1});
pf.loadFromHTML(document.querySelectorAll('.page'));
const num=document.getElementById('num');
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const upd=()=>{const idx=pf.getCurrentPageIndex(),p=N-idx;const two=pf.getOrientation()==='landscape'&&p>1&&p<N;num.textContent=(two?fa(p-1)+'–'+fa(p):fa(p))+' از '+fa(N)};
pf.on('flip',upd);pf.on('changeOrientation',upd);upd();
document.getElementById('next').onclick=()=>pf.flipPrev();
document.getElementById('prev').onclick=()=>pf.flipNext();
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pf.flipPrev();if(e.key==='ArrowRight')pf.flipNext();});
document.getElementById('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
</script>
</body>
</html>
